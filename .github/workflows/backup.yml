name: Weekly backup (D1 dump + R2 mirror)

# Every Sunday 02:00 UTC: full D1 export + per-object R2 mirror into the
# filo-backup bucket (see scripts/backup.sh). Dumps rotate by day-of-month;
# mirrored objects linger after deletes by design (accidental-delete recovery).
on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/backup.sh
