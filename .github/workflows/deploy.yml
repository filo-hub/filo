name: Test & Deploy filo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

# A newer push supersedes an older one — never deploy stale main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vitest (miniflare D1/R2)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # build must pass too (Svelte compile + worker sync into dist)
      - run: npm run build
      # visibility only: dev-chain vulns (wrangler/miniflare) must not block deploys
      - run: npm audit --audit-level=high
        continue-on-error: true

  deploy:
    name: Deploy (Worker + Pages)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Schema first: a worker that queries columns the DB lacks 500s
      # (this exact drift blanked the dashboard once — never again).
      # TODO(enforce): drop continue-on-error once CLOUDFLARE_API_TOKEN
      # has Account/D1/Edit scope (currently 7403s). Remote DB is
      # already fully migrated; this step is a no-op safety net until then.
      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply filo-db --remote
        continue-on-error: true
      - run: npx wrangler deploy
      - name: Deploy to Pages (fileo.pages.dev — config from wrangler.pages.toml)
        run: |
          cp wrangler.toml /tmp/wrangler.toml.bak
          trap 'mv /tmp/wrangler.toml.bak wrangler.toml' EXIT
          cp wrangler.pages.toml wrangler.toml
          npx wrangler pages deploy dist --project-name fileo --branch main

  preview:
    name: Pages preview (PR)
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy PR preview
        run: |
          cp wrangler.toml /tmp/wrangler.toml.bak
          trap 'mv /tmp/wrangler.toml.bak wrangler.toml' EXIT
          cp wrangler.pages.toml wrangler.toml
          npx wrangler pages deploy dist --project-name fileo --branch "pr-${{ github.event.number }}"
      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const num = context.issue.number;
            const url = `https://pr-${num}.fileo.pages.dev`;
            const marker = `<!-- preview-comment -->`;
            const body = `${marker}\nPreview deployed: ${url}\n(note: preview shares production bindings — don't upload anything you care about)`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: num,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: num, body });
            }
