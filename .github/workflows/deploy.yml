name: Deploy filo to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Pages (filo-hub.pages.dev standalone — no workers.dev, like tgpc/nofi)
        run: |
          cp wrangler.toml wrangler.workers.toml
          cat > wrangler.toml <<'TOML'
          name = "filo-hub"
          compatibility_date = "2025-11-01"
          pages_build_output_dir = "./dist"
          [[r2_buckets]]
          binding = "BUCKET"
          bucket_name = "filo-files"
          [[d1_databases]]
          binding = "DB"
          database_name = "filo-db"
          database_id = "351337b5-6315-4004-961d-af7faa7288ec"
          TOML
          npx wrangler pages deploy dist --project-name filo-hub --branch main
          mv wrangler.workers.toml wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
