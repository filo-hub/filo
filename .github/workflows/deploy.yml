name: Test & Deploy filo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  test:
    name: vitest (miniflare D1/R2)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # build must pass too (Svelte compile + worker sync into dist)
      - run: npm run build

  deploy:
    name: Deploy (Worker + Pages)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wrangler deploy
      - name: Deploy to Pages (filo-hub.pages.dev — config from wrangler.pages.toml)
        run: npx wrangler pages deploy dist --project-name filo-hub --branch main --config wrangler.pages.toml

  preview:
    name: Pages preview (PR)
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy PR preview
        run: npx wrangler pages deploy dist --project-name filo-hub --branch "pr-${{ github.event.number }}" --config wrangler.pages.toml
      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const num = context.issue.number;
            const url = `https://pr-${num}.filo-hub.pages.dev`;
            const marker = `<!-- preview-comment -->`;
            const body = `${marker}\nPreview deployed: ${url}\n(note: preview shares production bindings — don't upload anything you care about)`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: num,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: num, body });
            }
