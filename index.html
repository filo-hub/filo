<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>filo</title>
<meta name="description" content="filo — upload once, link forever. Personal permanent file archive." />
<meta name="theme-color" content="#4f46e5" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="apple-touch-icon" href="/favicon.svg" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta property="og:type" content="website" />
<meta property="og:title" content="filo — Permanent Links" />
<meta property="og:description" content="Upload once, link forever. Personal permanent file archive." />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="filo — Permanent Links" />
<meta name="twitter:description" content="Upload once, link forever. Personal permanent file archive." />
<script>
(function(){
  // Apply dark mode before paint (prevents FOUC)
  try{
    var ls = localStorage.getItem('filo_theme');
    if (ls === 'dark' || (!ls && window.matchMedia('(prefers-color-scheme:dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  }catch(e){}
  // Make sure content is visible quickly (don't leave page blank if Svelte is slow)
  setTimeout(function(){ document.documentElement.style.visibility='visible'; }, 100);
})();
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
<script>document.documentElement.style.visibility='visible';</script>
</body>
</html>
