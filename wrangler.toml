name = "filo"
main = "worker.js"
compatibility_date = "2025-11-01"

# Workers Assets — Vite build output (like tgpc/nofi)
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# R2 bucket — filo only (tgpc untouched)
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "filo-files"

# D1 database — create with: wrangler d1 create filo-db
[[d1_databases]]
binding = "DB"
database_name = "filo-db"
database_id = "351337b5-6315-4004-961d-af7faa7288ec"

# Optional: set upload token. Or use: wrangler secret put UPLOAD_TOKEN
# If you want to protect upload/delete, re-add auth check in worker.js
# [vars]
# UPLOAD_TOKEN = "change-me"
# Optional: storage quota for the dashboard bar + upload check (default 10240 = 10GB)
# MAX_STORAGE_MB = 10240

[observability]
enabled = true
